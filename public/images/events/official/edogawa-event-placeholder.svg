  <rect width="1200" height="675" rx="42" fill="url(#background)"/>
  <circle cx="1080" cy="84" r="190" fill="#8bd3e1" opacity="0.32"/>
  <circle cx="105" cy="620" r="220" fill="#ffb89d" opacity="0.3"/>
  <path d="M0 544C178 487 301 595 477 544s323-29 471 18 214 25 252 4v109H0Z" fill="#78c9dc" opacity="0.46"/>
  <path d="M0 592c184-70 327 46 502-10s310-25 438 24 213 26 260-1v70H0Z" fill="#40acc8" opacity="0.72"/>

